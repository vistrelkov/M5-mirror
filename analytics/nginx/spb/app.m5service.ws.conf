# --- путь = страна: /collect/v2/e/<код>/ уходит на инбаунд своей ноды ---
map $m5_cc $m5_country_port {
    default 0;
    bg 10810; de 10811; ee 10812; fi 10813; it 10814;
    md 10815; nl 10816; pl 10817; us 10818;
}

server {
    listen 127.0.0.1:8080 ssl http2;
    server_name app.m5service.ws;

    ssl_certificate     /etc/letsencrypt/live/app.m5service.ws/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.m5service.ws/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/m5service.access.log;
    error_log  /var/log/nginx/m5service.error.log;

    root /var/www/m5service;

    # --- витрина: статика с диска, кешируется надолго ---
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "public, max-age=3600" always;
    }
    location = /docs.html {
        add_header Cache-Control "public, max-age=3600" always;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=604800, immutable" always;
    }

    # --- скрипт счётчика: из приложения, но кешируем ---
    location = /m5s.js {
        proxy_pass http://127.0.0.1:3000/script.js;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400" always;
    }

# приём событий по странам (туннель)
    location ~ "^/collect/v2/e/(?<m5_cc>[a-z]{2})/(?<m5_rest>.*)$" {
        if ($m5_country_port = 0) { return 404; }
        proxy_pass http://127.0.0.1:$m5_country_port/collect/v2/e/$m5_rest$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, private" always;
    }

    # --- приём событий и кабинет: без кеша ---
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, private" always;
    }
}

server {
    listen 80;
    server_name app.m5service.ws;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
