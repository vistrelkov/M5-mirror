# M5 origin CDN, Москва (VDSina #3252168, 193.124.67.94), 24.09.2026.
# Та же витрина, что на СПб (app.m5service.ws). Туннель /collect/v2/e/<cc>/ — локальный xray
# (remnanode, профиль M5-CDN-ORIGIN). Счётчик и кабинет (umami + БД) живут на СПб — проксируются туда.
map $m5_cc $m5_country_port {
    default 0;
    bg 10810; de 10811; ee 10812; fi 10813; it 10814;
    md 10815; nl 10816; pl 10817; us 10818;
}

server {
    listen 443 ssl http2;
    server_name app.m5service.ws;
    ssl_certificate     /etc/nginx/certs/app/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/app/privkey.pem;
    include /etc/nginx/snippets/m5s-site.conf;
}

server {
    listen 443 ssl http2 default_server;
    server_name o2.m5service.ws;
    ssl_certificate     /etc/letsencrypt/live/o2.m5service.ws/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/o2.m5service.ws/privkey.pem;
    include /etc/nginx/snippets/m5s-site.conf;
}
