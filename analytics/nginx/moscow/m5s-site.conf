ssl_protocols TLSv1.2 TLSv1.3;
access_log /var/log/nginx/m5service.access.log;
error_log  /var/log/nginx/m5service.error.log;
root /var/www/m5service;

location = / {
    try_files /index.html =404;
    add_header Cache-Control "public, max-age=3600" always;
}
location = /docs.html {
    add_header Cache-Control "public, max-age=3600" always;
}
location /assets/ {
    add_header Cache-Control "public, max-age=604800, immutable" always;
}

# приём событий по странам (туннель)
location ~ "^/collect/v2/e/(?<m5_cc>[a-z]{2})/(?<m5_rest>.*)$" {
    if ($m5_country_port = 0) { return 404; }
    proxy_pass http://127.0.0.1:$m5_country_port/collect/v2/e/$m5_rest$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store, no-cache, private" always;
}

# счётчик: скрипт кешируем, всё остальное (приём событий, кабинет) — на СПб без кеша
location = /m5s.js {
    proxy_pass https://5.188.25.116/m5s.js;
    proxy_ssl_server_name on;
    proxy_ssl_name app.m5service.ws;
    proxy_set_header Host app.m5service.ws;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=86400" always;
}
location / {
    proxy_pass https://5.188.25.116;
    proxy_ssl_server_name on;
    proxy_ssl_name app.m5service.ws;
    proxy_http_version 1.1;
    proxy_set_header Host app.m5service.ws;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store, no-cache, private" always;
}

