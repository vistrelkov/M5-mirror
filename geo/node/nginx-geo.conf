# Раздача geoip.dat/geosite.dat (зеркало Loyalsoldier).
# Вставить ВНУТРЬ server{}-блока, который обслуживает origin CDN на этом узле.
# Путь префиксный, побеждает catch-all location / независимо от порядка.
location /geo/ {
    alias /var/www/geo/;
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=3600" always;
}
