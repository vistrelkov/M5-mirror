# Раздача подписки через CDN (SUB_PUBLIC_DOMAIN=<cdn-домен>/rw-sub).
# Ставится в тот же server{}-блок origin-а, что и /geo/, на СЕРВЕРЕ ПАНЕЛИ
# (там, где локально крутится RemnaWave backend на 127.0.0.1:3100).
# Клиент → CDN → сюда → локальный RemnaWave. Подписка персональная → кеш ВЫКЛ.
location /rw-sub/ {
    proxy_pass http://127.0.0.1:3100/api/sub/;
    proxy_set_header Host <cdn-домен>;         # напр. s.m5service.name
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffer_size 16k;
    proxy_buffers 4 16k;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
}

# После этого в панели RemnaWave выставить:
#   SUB_PUBLIC_DOMAIN=<cdn-домен>/rw-sub   (в /opt/remnawave/.env)
#   docker compose up -d --force-recreate remnawave
# Старые клиенты продолжают ходить на прежний домен подписки напрямую.
