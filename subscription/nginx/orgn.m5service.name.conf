server {
    listen 80;
    listen [::]:80;
    server_name orgn.m5service.name;
    root /var/www/html;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 404; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name orgn.m5service.name;
    ssl_certificate     /etc/letsencrypt/live/orgn.m5service.name/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orgn.m5service.name/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;


    location /geo/ {
        alias /var/www/geo/;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=3600" always;
    }
    location /.well-known/acme-challenge/ { root /var/www/html; }
    
    # Подписка через CDN sub.m5vpn.com -> локальный RemnaWave
    location /rw-sub/ {
        proxy_pass http://127.0.0.1:3100/api/sub/;
        proxy_set_header Host s.m5service.name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    location / {
        root /var/www/m5service;
        try_files $uri /index.html;
        add_header Cache-Control "public, max-age=3600" always;
    }
}
